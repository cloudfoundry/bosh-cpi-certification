---
cpi: aws
properties:
  vip: ((bats_eip))
  second_static_ip: ((network_second_static_ip))
  pool_size: 1
  ssh_key_pair:
    public_key: ((ssh_public_key))
    private_key: ((ssh_private_key))
  stemcell:
    name: ((stemcell_name))
    version: latest
  instance_type: m6id.large
  instances: 1
  availability_zone: ((az))
  key_name: ((default_key_name))
  networks:
    - name: default
      static_ip: ((network_static_ip_1))
      type: manual
      cidr: ((internal_cidr))
      reserved: [((reserved_range))]
      static: [((static_range))]
      gateway: ((internal_gw))
      subnet: ((subnet_id))
      security_groups: ((default_security_groups))
      nic_group: ((default_nic_group))
    - name: ipv6
      static_ip: ((network_static_ipv6))
      type: manual
      cidr: ((ipv6_cidr))
      reserved: [((ipv6_reserved_range))]
      static: [((ipv6_static_range))]
      gateway: ((ipv6_gateway))
      subnet: ((subnet_id))
      security_groups: ((default_security_groups))
      nic_group: ((default_nic_group))
    - name: prefix
      type: manual
      prefix: ((network_prefix))
      cidr: ((ipv6_cidr))
      reserved: [((ipv6_reserved_range))]
      static: [((ipv6_static_range))]
      gateway: ((ipv6_gateway))
      subnet: ((subnet_id))
      security_groups: ((default_security_groups))
      nic_group: ((default_nic_group))
    - name: second
      static_ip: ((network_static_ip_2))
      type: manual
      cidr: ((internal_cidr))
      reserved: [((reserved_range))]
      static: [((static_range))]
      gateway: ((internal_gw))
      subnet: ((subnet_id))
      security_groups: ((default_security_groups))
      nic_group: ((second_nic_group))
